services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillverse_migrator
    restart: "no"
    environment:
      - DB_URL=${DB_URL:-postgresql://skillverse:skillverse_secrets@postgres:5432/gamifiedapp?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: skillverse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillverse_secrets}
      POSTGRES_DB: ${POSTGRES_DB:-gamifiedapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillverse} -d ${POSTGRES_DB:-gamifiedapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
