name: Validate Database Repository

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Go, CSV content and generated seeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: make fmt-check

      - name: Run tests
        run: go test -race ./...

      - name: Validate CSVs and verify seeds/sql is up to date
        run: go run ./cmd/db import -check
