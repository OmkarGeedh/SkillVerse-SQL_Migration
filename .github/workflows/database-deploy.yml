name: Deploy Database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and Seed Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Build database CLI
        run: go build -o bin/game-db ./cmd/db

      - name: Verify generated seeds match the CSVs
        run: ./bin/game-db import -check

      - name: Verify database connection secret is present
        run: |
          if [ -z "${DB_URL}" ]; then
            echo "::error::Missing database secret! Please configure 'DATABASE_URL' or 'DB_URL' in GitHub repository or 'production' environment secrets."
            exit 1
          fi
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.DB_URL }}

      - name: Apply database migrations
        run: ./bin/game-db migrate up
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.DB_URL }}

      - name: Upsert game content and demo users
        run: ./bin/game-db seed
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.DB_URL }}
